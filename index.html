<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工具箱</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: linear-gradient(135deg,#fdfbfb 0%,#ebedee 100%); color:#24292f; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; text-align:center; margin: 8px 0 4px; }
  .sub { text-align:center; color:#57606a; margin: 0 0 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.tool { display:block; background:#fff; border-radius:14px; padding:20px 16px; text-decoration:none; color:#24292f; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  a.tool .icon { font-size: 28px; }
  a.tool .name { font-weight: 600; margin-top: 8px; }
  a.tool .desc { color:#57606a; font-size: 13px; margin-top: 4px; line-height:1.5; }
  .foot { text-align:center; color:#8b949e; font-size:12px; margin-top:28px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🧰 我的工具箱</h1>
    <p class="sub">打开就能用，所有计算都在你自己的浏览器里完成，不上传任何数据。</p>
    <div class="grid">
      <a class="tool" href="tools/password.html"><div class="icon">🔑</div><div class="name">随机密码生成器</div><div class="desc">生成强密码，一键复制</div></a>
      <a class="tool" href="tools/qrcode.html"><div class="icon">🔳</div><div class="name">二维码生成器</div><div class="desc">网址或文字变二维码，可下载</div></a>
      <a class="tool" href="tools/convert.html"><div class="icon">🔄</div><div class="name">单位换算</div><div class="desc">长度、重量、温度互换</div></a>
      <a class="tool" href="tools/wordcount.html"><div class="icon">📝</div><div class="name">字数统计</div><div class="desc">字数、字符、行数一目了然</div></a>
      <a class="tool" href="tools/pomodoro.html"><div class="icon">🍅</div><div class="name">番茄钟</div><div class="desc">25 分钟专注计时</div></a>
    </div>
    <p class="foot">crispy-octo-invention · 创建于 2026 年 11 月 15 日</p>
  </div>
</body>
</html>
