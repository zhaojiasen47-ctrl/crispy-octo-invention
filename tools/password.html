<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机密码生成器</title>
<style>
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; margin:0; background:#f6f8fa; color:#24292f; }
  .wrap { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  a.back { color:#0969da; text-decoration:none; font-size:14px; }
  h1 { font-size:22px; }
  .card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  #pwd { width:100%; box-sizing:border-box; font-size:18px; padding:12px; border:1px solid #d0d7de; border-radius:8px; word-break:break-all; min-height:52px; background:#f6f8fa; }
  label { display:block; margin:12px 0 4px; font-size:14px; color:#57606a; }
  .row { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .row label { margin:0; display:flex; align-items:center; gap:6px; color:#24292f; }
  button { background:#0969da; color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:16px; margin-top:16px; cursor:pointer; }
  button.ghost { background:#eaeef2; color:#24292f; }
  input[type=range] { width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 返回工具箱</a>
  <h1>🔑 随机密码生成器</h1>
  <div class="card">
    <div id="pwd">点下面按钮生成</div>
    <label>长度：<span id="lenVal">16</span></label>
    <input type="range" id="len" min="8" max="64" value="16">
    <div class="row">
      <label><input type="checkbox" id="upper" checked> 大写字母</label>
      <label><input type="checkbox" id="lower" checked> 小写字母</label>
      <label><input type="checkbox" id="digit" checked> 数字</label>
      <label><input type="checkbox" id="symbol" checked> 符号</label>
    </div>
    <button id="gen">生成密码</button>
    <button id="copy" class="ghost">复制</button>
    <p style="color:#57606a;font-size:13px;">密码在本地用安全随机数生成，不会上传。</p>
  </div>
</div>
<script>
  const sets = { upper:"ABCDEFGHJKLMNPQRSTUVWXYZ", lower:"abcdefghijkmnpqrstuvwxyz", digit:"23456789", symbol:"!@#$%^&*()-_=+[]{}" };
  const $ = id => document.getElementById(id);
  $("len").oninput = () => $("lenVal").textContent = $("len").value;
  function gen(){
    let pool = "";
    for (const k in sets) if ($(k).checked) pool += sets[k];
    if (!pool) { $("pwd").textContent = "至少勾选一种字符"; return; }
    const len = +$("len").value, buf = new Uint32Array(len);
    crypto.getRandomValues(buf);
    $("pwd").textContent = [...buf].map(n => pool[n % pool.length]).join("");
  }
  $("gen").onclick = gen;
  $("copy").onclick = async () => { try { await navigator.clipboard.writeText($("pwd").textContent); $("copy").textContent = "已复制 ✓"; setTimeout(()=>$("copy").textContent="复制",1500); } catch(e){} };
  gen();
</script>
</body>
</html>
